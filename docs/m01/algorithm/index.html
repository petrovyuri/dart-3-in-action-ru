<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Порядок команд</title>
    <link rel="stylesheet" href="../../kit/kit.css?v=llm-1" />
    <style>
      .cmds {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }
      .cmd {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 6px 4px 10px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .cmd.is-now {
        border-color: var(--orange);
        box-shadow: inset 3px 0 var(--orange);
      }
      .cmd.is-skipped .cmd__name {
        color: var(--muted);
        text-decoration: line-through;
      }
      .cmd__num {
        color: var(--cyan);
        font-family: ui-monospace, Consolas, monospace;
      }
      .cmd__name {
        flex: 1;
        min-width: 0;
      }
      .cmd__mark {
        width: 1.2em;
        text-align: center;
        font-weight: 700;
      }
      .cmd button {
        padding: 2px 9px;
      }

      /* Сцена растягивается под высоту iframe, эмодзи растут вместе с ней (cqh). */
      .scene {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        min-height: 92px;
        container-type: size;
      }
      .zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 2px;
        padding: 6px 6px 4px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .zone.is-bad {
        border-color: var(--red);
        box-shadow: inset 0 0 0 1px var(--red);
      }
      .zone.is-good {
        border-color: var(--green);
      }
      .actors {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 32px;
        font-size: clamp(30px, min(26cqh, 11cqw), 56px);
        line-height: 1;
        white-space: nowrap;
      }
      .actors .small {
        font-size: 0.65em;
        align-self: flex-end;
      }
      .actors .hero {
        font-size: 1.25em;
      }
      .journal {
        margin: 0;
        padding-left: 2.2em;
      }
      .journal li::marker {
        color: var(--muted);
      }
      .zone__name {
        color: var(--muted);
        font-size: 12.5px;
        text-align: center;
      }
      .zone__name.on {
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Модуль 1 · урок 2</p>
    <h1 style="text-align: center">Важен ли порядок команд?</h1>
    <noscript
      ><div class="panel">Для интерактива нужен JavaScript.</div></noscript
    >

    <div class="panel row row--spread">
      <div class="row" id="presets"></div>
      <div class="row">
        <button type="button" id="step">шаг</button>
        <button type="button" class="btn-play" id="play">▶ до конца</button>
        <button type="button" id="reset">сброс</button>
        <span class="counter" id="counter"></span>
      </div>
    </div>

    <div class="panel work fill">
      <div class="work__main">
        <p class="label">Алгоритм: стрелки меняют порядок команд</p>
        <ol class="cmds" id="commands" aria-label="Алгоритм"></ol>
        <p class="label wide-only">Журнал выполнения</p>
        <ol
          class="console journal fill wide-only"
          id="journal"
          aria-label="Журнал выполнения"
        ></ol>
      </div>
      <div class="work__side">
        <p class="label">Игра</p>
        <div class="scene fill" id="scene" role="img"></div>
        <p class="caption" id="caption" aria-live="polite"></p>
      </div>
    </div>

    <script type="module" src="./app.js?v=llm-1"></script>
  </body>
</html>
