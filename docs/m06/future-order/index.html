<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>В каком порядке вывод?</title>
    <link rel="stylesheet" href="../../kit/kit.css?v=llm-1" />
    <style>
      .code li {
        min-height: 1.3em;
        line-height: 1.3;
      }

      .code li:empty {
        min-height: 0.6em;
        line-height: 0.6;
      }

      .code li:empty::before {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center">В каком порядке вывод?</h1>
    <noscript
      ><div class="panel">Для интерактива нужен JavaScript.</div></noscript
    >
    <div class="panel row row--spread">
      <div
        class="row"
        id="presets"
        role="group"
        aria-label="Варианты ожидания"
      ></div>
      <div class="row">
        <button type="button" class="btn-play" id="run">▶ Запустить</button>
        <button type="button" id="reset">Сбросить</button>
      </div>
    </div>

    <div class="panel work fill">
      <div class="work__main">
        <p class="label wide-only">Программа</p>
        <ol class="code fill" id="code" aria-label="Код программы"></ol>
      </div>
      <div class="work__side">
        <p class="label wide-only">Консоль</p>
        <pre
          class="console has-cursor fill"
          id="console"
          aria-label="Результат запуска"
          aria-live="polite"
        ></pre>
        <p class="caption" id="caption" aria-live="polite"></p>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
